name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:  # Cho phép nhấn nút chạy thủ công

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Cấp quyền thực thi
        run: chmod +x gradlew

      - name: Tạo APK Debug
        run: ./gradlew assembleDebug

      - name: Tải APK lên để tải về
        uses: actions/upload-artifact@v4
        with:
          name: StickerCuaToi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
