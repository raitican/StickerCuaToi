name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Tải Gradle Wrapper
        run: |
          curl -fsSL https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Tạo APK Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Tải APK về
        uses: actions/upload-artifact@v4
        with:
          name: StickerCuaToi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
